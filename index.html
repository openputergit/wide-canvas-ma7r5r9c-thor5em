<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlock File Share</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .modal-backdrop {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }
        .enlock-blue {
            background-color: #0052CC;
        }
        .enlock-blue-text {
            color: #0052CC;
        }
        .tab-active {
            border-bottom: 2px solid #0052CC;
            color: #0052CC;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    <!-- Modal Backdrop -->
    <div class="modal-backdrop fixed inset-0 flex items-center justify-center">
        <!-- Modal Container -->
        <div class="bg-white rounded-lg w-full max-w-2xl mx-4 shadow-xl">
            <!-- Modal Header -->
            <div class="p-6 border-b">
                <h2 class="text-xl font-semibold text-gray-800">Share File</h2>
                <p class="text-gray-600 mt-1">document.pdf</p>
            </div>

            <!-- Tabs -->
            <div class="flex border-b">
                <button class="tab-active px-6 py-3 font-medium text-sm flex-1" id="publicTab">Public Share</button>
                <button class="text-gray-600 px-6 py-3 font-medium text-sm flex-1" id="privateTab">Private Share</button>
            </div>

            <!-- Public Share Content -->
            <div id="publicContent" class="p-6 space-y-6">
                <!-- Password Protection -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between">
                        <label class="text-sm font-medium text-gray-700">Password Protection</label>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="passwordToggle" class="sr-only peer">
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                        </label>
                    </div>
                    <input type="password" id="password" class="hidden w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter password">
                </div>

                <!-- Expiration -->
                <div class="space-y-2">
                    <label class="text-sm font-medium text-gray-700">Expiration</label>
                    <select class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="1">1 day</option>
                        <option value="7">7 days</option>
                        <option value="30">30 days</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>

                <!-- Download Limit -->
                <div class="space-y-2">
                    <label class="text-sm font-medium text-gray-700">Download Limit</label>
                    <input type="number" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="No limit">
                </div>

                <!-- Permissions -->
                <div class="space-y-2">
                    <label class="text-sm font-medium text-gray-700">Permissions</label>
                    <div class="space-y-2">
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" class="rounded text-blue-600" checked>
                            <span class="text-sm text-gray-700">View only</span>
                        </label>
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" class="rounded text-blue-600">
                            <span class="text-sm text-gray-700">Allow download</span>
                        </label>
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" class="rounded text-blue-600">
                            <span class="text-sm text-gray-700">Allow edit</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Private Share Content -->
            <div id="privateContent" class="hidden p-6 space-y-6">
                <!-- Email Input -->
                <div class="space-y-2">
                    <label class="text-sm font-medium text-gray-700">Recipients</label>
                    <div class="space-y-2" id="emailContainer">
                        <div class="flex space-x-2">
                            <input type="email" class="flex-1 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter email address">
                            <select class="w-32 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="view">View</option>
                                <option value="download">Download</option>
                                <option value="edit">Edit</option>
                                <option value="full">Full</option>
                            </select>
                        </div>
                    </div>
                    <button class="text-sm font-medium text-blue-600" id="addEmail">+ Add more</button>
                </div>

                <!-- Expiration -->
                <div class="space-y-2">
                    <label class="text-sm font-medium text-gray-700">Expiration</label>
                    <select class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="1">1 day</option>
                        <option value="7">7 days</option>
                        <option value="30">30 days</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="p-6 border-t flex justify-end space-x-4">
                <button class="px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 rounded-lg">Cancel</button>
                <button class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700" id="actionButton">Generate Link</button>
            </div>
        </div>
    </div>

    <script>
        // Tab switching
        const publicTab = document.getElementById('publicTab');
        const privateTab = document.getElementById('privateTab');
        const publicContent = document.getElementById('publicContent');
        const privateContent = document.getElementById('privateContent');
        const actionButton = document.getElementById('actionButton');

        publicTab.addEventListener('click', () => {
            publicTab.classList.add('tab-active');
            privateTab.classList.remove('tab-active');
            publicContent.classList.remove('hidden');
            privateContent.classList.add('hidden');
            actionButton.textContent = 'Generate Link';
        });

        privateTab.addEventListener('click', () => {
            privateTab.classList.add('tab-active');
            publicTab.classList.remove('tab-active');
            privateContent.classList.remove('hidden');
            publicContent.classList.add('hidden');
            actionButton.textContent = 'Share';
        });

        // Password toggle
        const passwordToggle = document.getElementById('passwordToggle');
        const passwordInput = document.getElementById('password');

        passwordToggle.addEventListener('change', () => {
            passwordInput.classList.toggle('hidden');
        });

        // Add email field
        const addEmail = document.getElementById('addEmail');
        const emailContainer = document.getElementById('emailContainer');

        addEmail.addEventListener('click', () => {
            const newEmailField = document.createElement('div');
            newEmailField.className = 'flex space-x-2';
            newEmailField.innerHTML = `
                <input type="email" class="flex-1 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter email address">
                <select class="w-32 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="view">View</option>
                    <option value="download">Download</option>
                    <option value="edit">Edit</option>
                    <option value="full">Full</option>
                </select>
            `;
            emailContainer.appendChild(newEmailField);
        });
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
